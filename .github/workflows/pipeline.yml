name: Data Pipeline
on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GF_SITES_JSON: ${{ secrets.GF_SITES_JSON }}
      ALL_GF_NON_AUTOMATION_SITES: ${{ secrets.ALL_GF_NON_AUTOMATION_SITES }}
      # CTM
      CTM_SITES: ${{ secrets.CTM_SITES }}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      # Google OAuth
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      # Search Console
      GSC_SITES_JSON: ${{ secrets.GSC_SITES_JSON }}
      AUTOMATION_PAGE_REGEX: ${{ secrets.AUTOMATION_PAGE_REGEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pipeline
        run: python main.py
